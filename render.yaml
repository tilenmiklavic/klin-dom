# Render Blueprint: the KlinDom API (docker). Secrets are prompted for in the dashboard (sync: false).
services:
  - type: web
    name: klindom-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: jwks
      - key: DATABASE_SSL
        value: require
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: APP_URL
        sync: false
